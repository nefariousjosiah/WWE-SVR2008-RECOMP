# Codegen fixes for default.xex (included from svr2008_manifest.toml [entrypoint]).

# D3D Swap (sub_8223A4B8) just loaded the present interval (device+13572) into r10; logged.
[[midasm_hook]]
name = "SvrPresentIntervalHook"
address = 0x8223A56C
registers = ["r10"]
after_instruction = true

# Frame-rate mode (src/fps_hooks.cpp): with --svr_60fps the game stays in its 60 fps mode.
# SetFrameRate(fps): r3 = requested rate; 30/25 become 60/50.
[[midasm_hook]]
name = "SvrSetFrameRateHook"
address = 0x824707A8
registers = ["r3"]

# "Drop to 30 fps mode": skipped (returns immediately) when the hook returns true.
[[midasm_hook]]
name = "SvrSkip30ModeHook"
address = 0x82470A18
registers = []
return_on_true = true

# The game's swap function (sub_8223A960) about to call VdSwap: once per presented frame.
# src/fps_hooks.cpp counts frames for the on-screen FPS counter (F2).
[[midasm_hook]]
name = "SvrFrameSwapHook"
address = 0x8223ABAC
registers = []

# Cutscene captions (src/fps_hooks.cpp): the caption code's loads of the target fps (frame-rate
# struct +8, 60 / fps turns caption times into 60ths) see 30 in the 60 fps mode.
# Caption display update (sub_82261650): show check, then hide check.
[[midasm_hook]]
name = "SvrCaptionFpsShowHook"
address = 0x822616F0
registers = ["r30"]
after_instruction = true

[[midasm_hook]]
name = "SvrCaptionFpsHideHook"
address = 0x822616A4
registers = ["r31"]
after_instruction = true

# Caption display segment (sub_82261748): times of a voice clip's captions, from the clip's start.
[[midasm_hook]]
name = "SvrCaptionFpsSegmentHook"
address = 0x82261818
registers = ["r11"]
after_instruction = true

# Caption manager (sub_8226BC80): the clip start it hands the display.
[[midasm_hook]]
name = "SvrCaptionFpsStartHook"
address = 0x8226BD64
registers = ["r11"]
after_instruction = true

